spring:
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:h2:mem:bustraker-demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never
  flyway:
    enabled: false
server:
  servlet:
    session:
      cookie:
        secure: false
jwt:
  secret: demo-only-secret-not-for-production
app:
  synthetic-data:
    enabled: false
