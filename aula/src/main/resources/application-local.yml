spring:
  flyway:
    enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bustraker}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
app:
  synthetic-data:
    enabled: ${SYNTHETIC_DATA_ENABLED:true}
server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
jwt:
  secret: ${JWT_SECRET:local-only-secret-key-do-not-use-in-production}
