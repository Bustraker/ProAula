spring:
  config:
    import: optional:file:./.env[.properties]
  flyway:
    enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/${DB_NAME:bustraker}}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
app:
  firebase:
    admin-enabled: ${FIREBASE_ADMIN_ENABLED:false}
    credentials-file: ${FIREBASE_CREDENTIALS_FILE:}
    vapid-key: ${FIREBASE_VAPID_KEY:}
  synthetic-data:
    enabled: ${SYNTHETIC_DATA_ENABLED:true}
  admin:
    approver-email: ${ADMIN_APPROVER_EMAIL:admin.demo@proaula.local}
  demo-accounts:
    enabled: ${DEMO_ACCOUNTS_ENABLED:true}
    user-username: ${DEMO_USER_USERNAME:usuario_demo}
    user-email: ${DEMO_USER_EMAIL:usuario.demo@proaula.local}
    user-password: ${DEMO_USER_PASSWORD:UsuarioDemo#2026}
    admin-username: ${DEMO_ADMIN_USERNAME:admin_demo}
    admin-email: ${DEMO_ADMIN_EMAIL:admin.demo@proaula.local}
    admin-password: ${DEMO_ADMIN_PASSWORD:AdminDemo#2026!}
    admin-code: ${DEMO_ADMIN_CODE:Local-Admin-Access-2026!}
server:
  ssl:
    enabled: ${LOCAL_HTTPS_ENABLED:false}
    key-store: ${LOCAL_HTTPS_KEYSTORE:}
    key-store-password: ${LOCAL_HTTPS_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
jwt:
  secret: ${JWT_SECRET:${random.uuid}}
