<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bustraker - Gestión de Incidentes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- Navbar simple -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand font-weight-bold" href="#">🚨 Bustraker - Control de Incidentes</a>
            <a href="/" class="btn btn-outline-light btn-sm">Volver al Inicio</a>
        </div>
    </nav>

    <div class="container">
        <!-- Filtros de Búsqueda (BUS-39) -->
        <div class="card p-3 mb-4 shadow-sm border-0">
            <h5 class="card-title text-secondary mb-3"><i class="bi bi-funnel"></i> Filtrar Reportes</h5>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label font-weight-bold">Tipo de Incidente</label>
                    <select id="filtroTipo" class="form-select">
                        <option value="">Todos los tipos</option>
                        <option value="RETRASO">Retraso de Ruta</option>
                        <option value="FALLA_SERVICIO">Falla del bus o del servicio</option>
                        <option value="ACCIDENTE">Accidente / Bloqueo</option>
                        <option value="RUTA_DESVIADA">Desvío de ruta</option>
                        <option value="OTRO">Otro</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label class="form-label font-weight-bold">Buscar por Ruta o Bus</label>
                    <input type="text" id="filtroRuta" class="form-control" placeholder="Ej: Bus El Campestre, Ruta 1...">
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button class="btn btn-primary w-100 fw-bold" type="button" onclick="filtrarIncidentes()">
                        <i class="bi bi-search"></i> Buscar
                    </button>
                </div>
            </div>
        </div>

        <!-- Tabla de Incidentes -->
        <div class="card shadow-sm border-0 p-3">
            <h5 class="card-title text-secondary mb-3"><i class="bi bi-list-ul"></i> Lista de Incidentes Reportados</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th># ID</th>
                            <th>Ruta / Bus</th>
                            <th>Tipo</th>
                            <th>Descripción</th>
                            <th>Fecha y Hora</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tablaIncidentes" aria-live="polite">
                        <tr><td colspan="6" class="text-center text-muted">Cargando incidentes...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script th:src="@{/incidentes.js}"></script>
</body>
</html>
