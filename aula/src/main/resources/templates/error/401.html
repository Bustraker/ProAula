<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Error 401 - No Autorizado - Bustraker">
    <meta name="theme-color" content="#ffc107">
    <title>Error 401 - No Autorizado - Bustraker</title>
    <link rel="stylesheet" th:href="@{/css/style_login.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="shortcut icon" th:href="@{/images/Bus_icono.png}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body data-redirect-url="/inicio-de-sesion-mejorado" data-redirect-timeout="5000">
    <!-- Encabezado -->
    <header class="main-header">
        <div class="header-inner">
            <div class="logo">
                <img th:src="@{/images/Bus_icono.png}" alt="Logo Bustraker">
                <span class="brand">Bustraker</span>
            </div>
            <nav class="main-nav">
                <a th:href="@{/}" class="nav-link">
                    <i class="fas fa-home"></i> Inicio
                </a>
                <a th:href="@{/inicio-de-sesion-mejorado}" class="nav-link">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </a>
            </nav>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="hero-section py-4">
        <div class="container container-sm">
            <div class="error-container">
                <div class="error-code">401</div>
                <h1 class="error-title">No Autorizado</h1>
                <p class="error-message" th:text="${errorMessage}">Debes iniciar sesión para acceder a este recurso.</p>

                <!-- Acciones -->
                <div class="error-actions">
                    <a th:href="@{/inicio-de-sesion-mejorado}" class="btn-error btn-primary">
                        <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                    </a>
                    <a th:href="@{/registro-mejorado}" class="btn-error btn-secondary">
                        <i class="fas fa-user-plus"></i> Registrarse
                    </a>
                    <a th:href="@{/}" class="btn-error btn-secondary">
                        <i class="fas fa-home"></i> Ir al Inicio
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script th:src="@{/js/error.js}"></script>
</body>
</html>
