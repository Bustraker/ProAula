<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Completar registro</title>
    <link rel="stylesheet" th:href="@{/css/style_login.css}">
</head>
<body>
<main class="login-container">
    <section class="login-card">
        <h1>Completa tu registro</h1>
        <p>Bienvenido, <strong th:text="${username}">usuario</strong>. Define una contraseña para tu cuenta.</p>
        <p th:if="${error}" th:text="${error}" class="error-message"></p>
        <form th:action="@{/oauth2/complete-password}" method="post">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" minlength="6" required>
            <label for="confirmPassword">Confirmar contraseña</label>
            <input id="confirmPassword" name="confirmPassword" type="password" minlength="6" required>
            <button type="submit">Guardar contraseña</button>
        </form>
    </section>
</main>
</body>
</html>
