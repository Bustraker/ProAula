<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="theme-color" content="#24191c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Asignar Conductor a Ruta</title>
    <link rel="icon" th:href="@{/images/bustraker-logo-full.png(v='official-logo-20261120-1')}" type="image/png">
    <link rel="stylesheet" th:href="@{/css/style.css}" /> <!-- Estilo base -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-brand.css(v='admin-brand-20261120-1')}">
    <link rel="stylesheet" th:href="@{/css/admin-navigation.css(v='admin-navigation-20261120-1')}">
    <link rel="stylesheet" th:href="@{/css/accessibility.css}">
    <link rel="stylesheet" th:href="@{/css/brand-logo.css(v='official-logo-20261120-3')}">
</head>
<body class="admin-assignment" data-accessibility-scope="admin">
<aside th:replace="~{Admin/fragments/admin-navigation :: sidebar('routes', 'admin-sidebar--assignment')}"></aside>
<h1>Asignar Conductor a Ruta</h1>

<form th:action="@{/asignaciones/guardar}" method="post" th:object="${asignacion}">
    <label for="conductor">Conductor:</label>
    <select id="conductor" th:field="*{conductor.id}" required>
        <option value="" disabled selected>Selecciona un conductor</option>
        <option th:each="cond : ${conductores}" th:value="${cond.id}" th:text="'Conductor anónimo #' + ${cond.id}"></option>
    </select>

    <label for="ruta">Ruta:</label>
    <select id="ruta" th:field="*{ruta.id}" required>
        <option value="" disabled selected>Selecciona una ruta</option>
        <option th:each="ruta : ${rutas}" th:value="${ruta.id}" th:text="${ruta.origen} + ' - ' + ${ruta.destino}"></option>
    </select>

    <label for="fecha">Fecha de Asignación:</label>
    <input type="date" id="fecha" th:field="*{fecha}" required />

    <label for="hora">Hora de Asignación:</label>
    <input type="time" id="hora" th:field="*{hora}" required />

    <button type="submit">Guardar Asignación</button>
</form>

<p><a th:href="@{/asignaciones/listar}">Volver a la lista de asignaciones</a></p>
    <script th:src="@{/js/accessibility.js}" defer></script>
</body>
</html>
