<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#01315f">
    <title>Solicitar invitación ADMIN - Bustraker</title>
    <link rel="stylesheet" th:href="@{/css/style_common.css}">
    <link rel="stylesheet" th:href="@{/css/style_auth.css}">
</head>
<body class="auth-body">
<main class="hero-section auth-page">
    <section class="container container-sm auth-content" aria-labelledby="requestTitle">
        <div class="card_animate-slideUp">
            <div class="card-header">
                <h1 id="requestTitle">Solicitar acceso ADMIN</h1>
            </div>
            <div class="card-body">
                <div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
                <p>La solicitud se enviará al administrador para revisión. Si se aprueba, recibirás un código de un solo uso por correo.</p>
                <form th:action="@{/solicitar-codigo-admin}" method="post">
                    <div class="form-group">
                        <label class="form-label" for="email">Correo electrónico</label>
                        <input class="form-control" type="email" id="email" name="email"
                               autocomplete="email" maxlength="254" required>
                    </div>
                    <button class="btn btn-primary btn-block" type="submit">Enviar solicitud</button>
                </form>
                <p class="text-center mt-3"><a th:href="@{/registro-mejorado}">Volver al registro</a></p>
            </div>
        </div>
    </section>
</main>
</body>
</html>
