<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario - Bustraker</title>
    <link rel="icon" th:href="@{/images/bustraker-logo-full.png(v='official-logo-20261120-1')}" type="image/png">
    <link rel="stylesheet" th:href="@{/css/style_perfil.css}">
    <link rel="stylesheet" th:href="@{/css/logout.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/accessibility.css}">
    <link rel="stylesheet" th:href="@{/css/brand-logo.css(v='official-logo-20261120-3')}">
    <link rel="stylesheet" th:href="@{/css/user-navigation.css(v='user-navigation-20261120-2')}">
</head>
<body class="legacy-user-profile" data-accessibility-scope="user">
    <th:block th:replace="~{Usuario/fragments/user-navigation :: header('profile')}"></th:block>

    <!-- Contenido principal -->
    <main class="container container-md">
        <div class="content-wrapper-inner">
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-user-edit"></i> Información de Perfil</h3>
                </div>
                <div class="card-body">
                    <!-- Ajuste de formulario: elimina duplicado de binding -->
                    <form th:action="@{/perfil/actualizar}" method="post">
                        <div class="form-row">
                            <div class="form-col form-col-6">
                                <div class="form-group">
                                    <label for="nombres" class="form-label">
                                        <i class="fas fa-user"></i> Nombres:
                                    </label>
                                    <input type="text" id="nombres" name="nombres"
                                           class="form-control"
                                           th:value="${usuario?.nombres}" required>
                                </div>
                            </div>

                            <div class="form-col form-col-6">
                                <div class="form-group">
                                    <label for="apellidos" class="form-label">
                                        <i class="fas fa-user-tag"></i> Apellidos:
                                    </label>
                                    <input type="text" id="apellidos" name="apellidos"
                                           class="form-control"
                                           th:value="${usuario?.apellidos}" required>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="username" class="form-label">
                                <i class="fas fa-at"></i> Usuario:
                            </label>
                            <input type="text" id="username" name="username"
                                   class="form-control"
                                   th:value="${usuario?.username}" readonly>
                            <small class="form-text text-muted">El nombre de usuario no se puede cambiar</small>
                        </div>

                        <div class="form-group">
                            <label for="email" class="form-label">
                                <i class="fas fa-envelope"></i> Correo Electrónico:
                            </label>
                            <input type="email" id="email" name="email"
                                   class="form-control"
                                   th:value="${usuario?.email}" required>
                        </div>

                        <div class="form-group">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock"></i> Nueva Contraseña:
                            </label>
                            <input type="password" id="password" name="password"
                                   class="form-control"
                                   placeholder="Dejar vacío para mantener la actual">
                            <small class="form-text text-muted">Deja vacío si no deseas cambiar la contraseña</small>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword" class="form-label">
                                <i class="fas fa-lock"></i> Confirmar Contraseña:
                            </label>
                            <input type="password" id="confirmPassword" name="confirmPassword"
                                   class="form-control"
                                   placeholder="Confirma la nueva contraseña">
                        </div>

                        <div class="btn-group">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Guardar Cambios
                            </button>
                            <!-- Ajuste de ruta de regreso -->
                            <a th:href="@{/dashboard}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Volver
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script th:src="@{/js/perfil.js}"></script>
    <script th:src="@{/js/accessibility.js}" defer></script>
</body>
</html>
