spring:
  profiles:
    default: local
  datasource:
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        enable_lazy_load_no_trans: false
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder-google-client-secret}
            scope: openid,profile,email
          github:
            client-id: ${GITHUB_CLIENT_ID:placeholder-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:placeholder-github-client-secret}
            scope: user:email
          discord:
            client-id: ${DISCORD_CLIENT_ID:placeholder-discord-client-id}
            client-secret: ${DISCORD_CLIENT_SECRET:placeholder-discord-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: identify,email
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:placeholder-facebook-client-id}
            client-secret: ${FACEBOOK_CLIENT_SECRET:placeholder-facebook-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: email,public_profile
        provider:
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: id
          discord:
            authorization-uri: https://discord.com/oauth2/authorize
            token-uri: https://discord.com/api/oauth2/token
            user-info-uri: https://discord.com/api/users/@me
            user-name-attribute: id
          facebook:
            authorization-uri: https://www.facebook.com/dialog/oauth
            token-uri: https://graph.facebook.com/oauth/access_token
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email
            user-name-attribute: id
server:
  port: ${PORT:3465}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      timeout: 30m
      tracking-modes: cookie
      persistent: true
      cookie:
        domain: ${SESSION_COOKIE_DOMAIN:}
        path: /
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        max-age: 1800
        name: BustrakerSession
management:
  endpoints:
    jmx:
      enabled: false
    web:
      exposure:
        include: health,info
jwt:
  secret: ${JWT_SECRET:local-only-secret-key-do-not-use-in-production}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
carto:
  api-key: ${CARTO_API_KEY:}
app:
  admin:
    registration-code: ${ADMIN_REGISTRATION_CODE:}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
