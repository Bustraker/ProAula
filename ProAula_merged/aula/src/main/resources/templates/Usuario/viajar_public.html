<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Mapa y consulta de rutas - Bustraker Público">
    <meta name="theme-color" content="#01315f">
    <title>Consulta de Rutas - Bustraker Público</title>
    <link rel="shortcut icon" th:href="@{/images/Bus_icono.png}" type="image/x-icon">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/viajar_public.css">
</head>
<body>
    <div id="map"></div>

    <div class="options-panel">
        <h2><i class="fas fa-route"></i> Consulta de rutas</h2>

        <label for="origen"><i class="fas fa-map-marker-alt"></i> 1. ¿En qué barrio estás?</label>
        <select id="origen" onchange="actualizarDestinosDisponibles()">
            <option value="">Selecciona tu barrio actual</option>
        </select>

        <button id="btnDetectarUbicacion" class="btn-secondary" onclick="usarUbicacionActual()" disabled>
            <i class="fas fa-location-arrow"></i> Detectar mi ubicación
        </button>

        <label for="destino"><i class="fas fa-map-pin"></i> 2. ¿A qué barrio vas?</label>
        <select id="destino" onchange="buscarRutasDisponibles()" disabled>
            <option value="">Primero selecciona tu barrio de origen</option>
        </select>

        <label for="ruta"><i class="fas fa-bus"></i> 3. Selecciona una ruta</label>
        <select id="ruta" onchange="mostrarRutaEnMapa()" disabled>
            <option value="">Primero selecciona origen y destino</option>
        </select>
        <div class="toggle-control" style="margin-top: 12px;">
            <label class="toggle-label">
                <input id="mostrarParadas" type="checkbox" checked>
                Mostrar paradas en la ruta
            </label>
        </div>

        <div id="rutaInfo" class="ruta-info" style="display:none;">
            <h4><i class="fas fa-info-circle"></i> Datos de la ruta</h4>
            <p><strong>Barrios:</strong> <span id="infoBarrios"></span></p>
            <p><strong>Hora:</strong> <span id="infoHora"></span></p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="/js/viajar_public.js"></script>
</body>
</html>
